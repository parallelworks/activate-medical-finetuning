# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
---
# ==============================================================================
# Medical LLM Fine-tuning Workflow
# ==============================================================================
# Fine-tunes LLMs (Llama2/3, Mistral, Gemma) on medical datasets using QLoRA/LoRA
# via Singularity containers. Generates vLLM-compatible merged weights.
#
# Organized Input Sections:
#   1. GPU Cluster                 - Compute target
#   2. Output Directory            - Where fine-tuned model weights are saved
#   3. Scheduler Options           - SLURM/PBS configuration
#   4. Model Selection             - Base model and configuration presets
#   5. Dataset Configuration       - Training data source and sampling
#   6. Training Hyperparameters    - Optimizer and batch settings
#   7. LoRA / PEFT Configuration   - Adapter and quantization settings
#   8. Output Configuration        - Model merging format
#   9. Container Options           - Singularity container path
#  10. Advanced Settings           - Run directory and repository
#
# OUTPUT COMPATIBILITY:
#   Produces a merged HuggingFace model directory ready for activate-rag-vllm.
#   Set Model Source → "Local Path" and Model Path → output_dir to serve immediately.
# ==============================================================================

permissions:
  - "*"

sessions:
  session:
    useTLS: false
    redirect: false
    useCustomDomain: false

on:
  execute:
    inputs:
      cluster:
        label: GPU Cluster
        type: compute-clusters
        optional: false
        autoselect: true
        include-workspace: false

      output_dir:
        label: Output Directory
        type: string
        default: "~/pw/models/fine-tuned-${PW_JOB_ID}"
        tooltip: >
          Directory where fine-tuned model weights will be saved.
          ${PW_JOB_ID} is resolved at runtime to produce a unique path.
          After training, point activate-rag-vllm Model Path to this directory.

      submit_to_scheduler:
        type: boolean
        label: Submit to Job Scheduler
        tooltip: >
          Enable to submit job via SLURM or PBS scheduler (detected automatically
          from resource). Disable for direct SSH execution on the login node.
        default: true
        hidden: ${{ inputs.cluster.schedulerType != 'slurm' && inputs.cluster.schedulerType != 'pbs' }}

      slurm:
        type: group
        label: SLURM Configuration
        hidden: ${{ inputs.submit_to_scheduler != true || inputs.cluster.schedulerType != 'slurm' }}
        collapsed: true
        items:
          is_enabled:
            type: boolean
            hidden: true
            default: true
            label: Is SLURM Enabled? Yes, unless the slurm section is hidden and ignored

          partition:
            type: slurm-partitions
            label: Partition
            optional: true
            resource: ${{ inputs.cluster }}
            tooltip: Partition for job submission (--partition)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.cluster.schedulerType != 'slurm' }}

          time:
            label: Walltime
            type: string
            default: '08:00:00'
            tooltip: Maximum job duration, e.g., 08:00:00 (--time)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.cluster.schedulerType != 'slurm' }}

          scheduler_directives:
            type: editor
            label: Additional Directives
            optional: true
            tooltip: |
              Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
              #SBATCH --exclusive
              #SBATCH --gres=gpu:4
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.cluster.schedulerType != 'slurm' }}

      pbs:
        type: group
        label: PBS Configuration
        hidden: ${{ inputs.submit_to_scheduler != true || inputs.cluster.schedulerType != 'pbs' }}
        collapsed: true
        items:
          is_enabled:
            type: boolean
            hidden: true
            default: true
            label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored

          scheduler_directives:
            label: Additional Directives
            type: editor
            tooltip: |
              Add extra PBS directives, one per line, using the #PBS prefix. For example:
              #PBS -l mem=64gb
              #PBS -l ngpus=4
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.cluster.schedulerType != 'pbs' }}

      model_selection:
        type: group
        label: Model Selection
        collapsed: false
        items:
          model_config:
            label: Configuration Preset
            type: dropdown
            default: llama3-8b-medical-quick
            optional: true
            options:
              - value: llama3-8b-medical-quick
                label: Llama 3 8B Medical (Quick Test)
              - value: llama3-8b-medical
                label: Llama 3 8B Medical (Production)
              - value: mistral-7b-medical
                label: Mistral 7B Medical
              - value: gemma-7b-medical
                label: Gemma 7B Medical

          model_source:
            label: Model Source
            type: dropdown
            default: huggingface
            tooltip: Use a pre-downloaded model (local) or clone from HuggingFace using git-lfs
            options:
              - value: local
                label: "Local Path (pre-staged weights)"
              - value: huggingface
                label: "HuggingFace Clone (git-lfs)"

          base_model_id:
            label: HuggingFace Model ID
            type: string
            default: "${{ inputs.model_selection.model_config == 'gemma-7b-medical' ? 'google/gemma-1.1-7b-it' : (inputs.model_selection.model_config == 'mistral-7b-medical' ? 'mistralai/Mistral-7B-Instruct-v0.2' : 'meta-llama/Llama-3.1-8B-Instruct') }}"
            optional: true
            tooltip: Model ID to clone from HuggingFace via git-lfs
            hidden: ${{ inputs.model_selection.model_source == 'local' }}
            ignore: ${{ inputs.model_selection.model_source == 'local' }}

          local_model_path:
            label: Model Path
            type: string
            default: "/models/Llama-3.1-8B-Instruct"
            optional: true
            hidden: ${{ inputs.model_selection.model_source != 'local' }}
            ignore: ${{ inputs.model_selection.model_source != 'local' }}
            tooltip: Full path to directory containing model weights

          hf_token:
            label: HuggingFace Token
            optional: true
            default: ${{ org.HF_TOKEN }}
            type: password
            tooltip: Required for gated models (Llama, etc.)
            hidden: ${{ inputs.model_selection.model_source != 'huggingface' }}
            ignore: ${{ inputs.model_selection.model_source != 'huggingface' }}

          model_cache_dir:
            type: string
            label: Model Cache Directory
            default: ~/pw/models
            tooltip: Directory to clone model into. Model is cloned once and reused for subsequent runs.
            hidden: ${{ inputs.model_selection.model_source != 'huggingface' }}
            ignore: ${{ inputs.model_selection.model_source != 'huggingface' }}

      dataset_config:
        type: group
        label: Dataset Configuration
        collapsed: true
        items:
          dataset_source:
            label: Dataset Source
            type: dropdown
            default: huggingface
            options:
              - value: huggingface
                label: HuggingFace Hub
              - value: local
                label: Local File Path

          dataset_cache_dir:
            label: Dataset Cache Directory
            type: string
            default: "~/pw/datasets"
            optional: true
            tooltip: Shared location for caching HuggingFace datasets across runs (HF_DATASETS_CACHE)

          dataset_name:
            label: Dataset Name (HuggingFace)
            type: string
            default: "${{ inputs.model_selection.model_config == 'llama3-8b-medical-quick' ? 'Shekswess/medical_llama3_instruct_dataset_short' : (inputs.model_selection.model_config == 'mistral-7b-medical' ? 'Shekswess/medical_mistral_instruct_dataset' : (inputs.model_selection.model_config == 'gemma-7b-medical' ? 'Shekswess/medical_gemma_instruct_dataset' : 'Shekswess/medical_llama3_instruct_dataset')) }}"
            hidden: ${{ inputs.dataset_config.dataset_source != 'huggingface' }}
            ignore: ${{ inputs.dataset_config.dataset_source != 'huggingface' }}

          local_dataset_path:
            label: Local Dataset Path
            type: string
            default: ""
            optional: true
            hidden: ${{ inputs.dataset_config.dataset_source != 'local' }}
            ignore: ${{ inputs.dataset_config.dataset_source != 'local' }}

          dataset_split:
            label: Dataset Split
            type: string
            default: train
            optional: true

          dataset_config_name:
            label: Dataset Config Name
            type: string
            default: ""
            optional: true
            hidden: ${{ inputs.dataset_config.dataset_source != 'huggingface' }}
            ignore: ${{ inputs.dataset_config.dataset_source != 'huggingface' }}

          dataset_format:
            label: Dataset Format
            type: dropdown
            default: json
            optional: true
            hidden: ${{ inputs.dataset_config.dataset_source != 'local' }}
            ignore: ${{ inputs.dataset_config.dataset_source != 'local' }}
            options:
              - value: json
                label: JSON / JSONL
              - value: csv
                label: CSV
              - value: parquet
                label: Parquet
              - value: arrow
                label: Arrow
              - value: dataset
                label: HuggingFace Dataset Directory

          prompt_field:
            label: Prompt Field Name
            type: string
            default: prompt
            optional: true

          max_samples:
            label: Max Samples (0 = all)
            type: number
            default: "${{ inputs.model_selection.model_config == 'llama3-8b-medical-quick' ? 50 : 0 }}"
            optional: true

      training_hyperparameters:
        type: group
        label: Training Hyperparameters
        collapsed: true
        items:
          num_epochs:
            label: Training Epochs
            type: number
            default: "${{ inputs.model_selection.model_config == 'llama3-8b-medical-quick' ? 1.0 : 3.0 }}"
            optional: true

          learning_rate:
            label: Learning Rate
            type: number
            default: 0.0002
            optional: true

          micro_batch_size:
            label: Micro Batch Size (per GPU)
            type: number
            default: "${{ inputs.model_selection.model_config == 'llama3-8b-medical-quick' ? 2 : 1 }}"
            optional: true

          gradient_accumulation:
            label: Gradient Accumulation Steps
            type: number
            default: "${{ inputs.model_selection.model_config == 'llama3-8b-medical-quick' ? 8 : 16 }}"
            optional: true

          max_seq_length:
            label: Max Sequence Length (tokens)
            type: number
            default: "${{ inputs.model_selection.model_config == 'llama3-8b-medical-quick' ? 512 : 2048 }}"
            optional: true

          tensorboard_enabled:
            label: Enable TensorBoard
            type: boolean
            default: false
            tooltip: >
              Start TensorBoard during training. The session URL in the Parallel Works UI
              will serve the TensorBoard dashboard on the allocated port.

      lora_config:
        type: group
        label: LoRA / PEFT Configuration
        collapsed: true
        items:
          lora_r:
            label: LoRA Rank (r)
            type: number
            default: "${{ inputs.model_selection.model_config == 'llama3-8b-medical-quick' ? 32 : 64 }}"
            optional: true

          lora_alpha:
            label: LoRA Alpha
            type: number
            default: 16
            optional: true

          lora_dropout:
            label: LoRA Dropout Rate
            type: number
            default: 0.05
            optional: true

          quantization:
            label: Quantization Mode
            type: dropdown
            default: 4bit
            optional: true
            options:
              - value: 4bit
              - value: 8bit
              - value: none

          gradient_checkpointing:
            label: Enable Gradient Checkpointing
            type: boolean
            default: true
            optional: true

          bf16:
            label: Use BF16 Mixed Precision
            type: boolean
            default: true
            optional: true

          packing:
            label: Enable Dataset Packing
            type: boolean
            default: false
            optional: true

      output_config:
        type: group
        label: Output Configuration
        collapsed: true
        items:
          merge_full_weights:
            label: Merge LoRA into Full Weights
            type: boolean
            default: true
            optional: true
            tooltip: >
              Merge LoRA adapters into the base model to produce a self-contained
              HuggingFace model directory that vLLM can load directly.

          merged_save_format:
            label: Merged Weights Format
            type: dropdown
            default: safetensors
            optional: true
            options:
              - value: safetensors
                label: SafeTensors (.safetensors)
              - value: bin
                label: PyTorch Binary (.bin)

      container:
        type: group
        label: Container Options
        collapsed: true
        items:
          finetune_path:
            label: Finetune Container Path
            type: string
            default: ~/pw/singularity/finetune.sif
            placeholder: ~/pw/singularity/finetune.sif
            tooltip: >
              Path to the Apptainer/Singularity container (.sif file or sandbox directory).
              If the path does not exist, the container is downloaded automatically via oras
              from ghcr.io/parallelworks/finetune:v1.0.

      advanced_settings:
        type: group
        label: Advanced Settings
        collapsed: true
        items:
          rundir:
            label: Run Directory
            type: string
            default: "~/pw/activate-medical-finetuning"
            optional: false

          repository:
            label: Repository URL
            type: string
            default: "https://github.com/parallelworks/activate-medical-finetuning.git"
            optional: true

          repository_branch:
            label: Repository Branch
            type: string
            default: "main"
            optional: true

          cuda_visible_devices:
            label: CUDA Visible Devices
            type: string
            optional: true
            tooltip: >
              Comma-separated list of GPU indices to expose to the training job (sets CUDA_VISIBLE_DEVICES).
              Leave empty to use all available GPUs. Set to "0" to restrict to the first GPU only.

jobs:
  prepare_job_directory:
    steps:
      - name: Preparing Run Directory
        early-cancel: any-job-failed
        run: |
          set -x
          RUNDIR="${{ inputs.advanced_settings.rundir }}"
          RUNDIR="${RUNDIR/#\~/$HOME}"

          OUTPUT_DIR="${{ inputs.output_dir }}"
          OUTPUT_DIR="${OUTPUT_DIR/#\~/$HOME}"

          mkdir -p "$(dirname "${RUNDIR}")"

          if [ -d "${RUNDIR}/.git" ]; then
            echo "Repository exists, updating..."
            cd "${RUNDIR}"
            git fetch origin
            git checkout ${{ inputs.advanced_settings.repository_branch }}
            git branch --set-upstream-to=origin/${{ inputs.advanced_settings.repository_branch }} 2>/dev/null || true
            git pull
          else
            echo "Cloning repository..."
            rm -rf "${RUNDIR}"
            git clone -b ${{ inputs.advanced_settings.repository_branch }} ${{ inputs.advanced_settings.repository }} "${RUNDIR}"
          fi

          cd "${RUNDIR}"
          git log -1 --oneline

          # Clean up stale marker/output files from previous runs
          rm -f jobid SESSION_PORT job.started job.ended run.out HOSTNAME

          # Create output directory
          mkdir -p "${OUTPUT_DIR}"

          # Needed for session_runner preprocessing
          touch controller.sh

          echo "RUNDIR=${RUNDIR}" >> $OUTPUTS
          echo "OUTPUT_DIR=${OUTPUT_DIR}" >> $OUTPUTS
        ssh:
          remoteHost: ${{ inputs.cluster.ip }}

  prepare-model:
    needs: [prepare_job_directory]
    if: ${{ inputs.model_selection.model_source == 'huggingface' }}
    steps:
      - name: Clone HuggingFace model
        early-cancel: any-job-failed
        run: |
          set -euo pipefail
          cd "${{ needs.prepare_job_directory.outputs.RUNDIR }}"

          command -v git >/dev/null 2>&1 || { echo "ERROR: git not found"; exit 1; }

          MODEL_ID="${{ inputs.model_selection.base_model_id }}"
          CACHE_DIR="${{ inputs.model_selection.model_cache_dir }}"
          CACHE_DIR="${CACHE_DIR/#\~/$HOME}"
          HF_TOKEN="${{ inputs.model_selection.hf_token }}"

          mkdir -p "${CACHE_DIR}"
          MODEL_BASENAME="${MODEL_ID##*/}"
          LEGACY_DIR="${CACHE_DIR}/${MODEL_ID//\//__}"
          TARGET_DIR="${CACHE_DIR}/${MODEL_BASENAME}"

          if [[ -d "${LEGACY_DIR}" && ! -d "${TARGET_DIR}" ]]; then
            echo "Renaming legacy cache dir ${LEGACY_DIR} to ${TARGET_DIR}"
            mv "${LEGACY_DIR}" "${TARGET_DIR}"
          fi

          if [[ -d "${TARGET_DIR}" && -f "${TARGET_DIR}/config.json" ]]; then
            echo "Model already cached at ${TARGET_DIR}"
          else
            echo "Cloning model ${MODEL_ID} to ${TARGET_DIR}"

            if [[ -z "${HF_TOKEN}" ]]; then
              echo "ERROR: HuggingFace token is not set."
              echo "Model '${MODEL_ID}' requires authentication."
              echo "Set an org-level secret HF_TOKEN or paste your token in the workflow form."
              exit 1
            fi

            # Ensure git-lfs is available
            if ! git lfs version >/dev/null 2>&1; then
              echo "Installing git-lfs locally..."
              mkdir -p "${HOME}/bin"
              cd /tmp
              if command -v curl >/dev/null 2>&1; then
                LFS_URL=$(curl -s https://api.github.com/repos/git-lfs/git-lfs/releases/latest | grep browser_download_url | grep linux-amd64 | head -1 | cut -d '"' -f 4)
              elif command -v wget >/dev/null 2>&1; then
                LFS_URL=$(wget -qO- https://api.github.com/repos/git-lfs/git-lfs/releases/latest | grep browser_download_url | grep linux-amd64 | head -1 | cut -d '"' -f 4)
              else
                echo "ERROR: curl or wget required to install git-lfs"
                exit 1
              fi
              [[ -z "$LFS_URL" ]] && { echo "ERROR: Could not find git-lfs download URL"; exit 1; }
              if command -v wget >/dev/null 2>&1; then
                wget -q "$LFS_URL" -O git-lfs-linux-amd64.tar.gz
              else
                curl -L "$LFS_URL" -o git-lfs-linux-amd64.tar.gz
              fi
              tar -xzf git-lfs-linux-amd64.tar.gz
              ./git-lfs-*/install.sh --local
              rm -rf git-lfs-*
              export PATH="${HOME}/bin:${PATH}"
              cd "${{ needs.prepare_job_directory.outputs.RUNDIR }}"
              git lfs version >/dev/null 2>&1 || { echo "ERROR: Failed to install git-lfs"; exit 1; }
            fi

            git lfs install

            REPO_URL="https://huggingface.co/${MODEL_ID}"
            [[ -n "${HF_TOKEN}" ]] && REPO_URL="https://user:${HF_TOKEN}@huggingface.co/${MODEL_ID}"

            GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 "${REPO_URL}" "${TARGET_DIR}"
            cd "${TARGET_DIR}"
            git lfs pull
            cd ..

            # Verify model weights exist (not just LFS pointers)
            if [[ -f "${TARGET_DIR}/model.safetensors" ]]; then
              actual_size=$(stat -c%s "${TARGET_DIR}/model.safetensors" 2>/dev/null || stat -f%z "${TARGET_DIR}/model.safetensors" 2>/dev/null)
              [[ ${actual_size} -lt 1000000 ]] && { echo "ERROR: model.safetensors appears to be an LFS pointer, not actual weights"; exit 1; }
            elif ls "${TARGET_DIR}"/model*.safetensors 1>/dev/null 2>&1; then
              for f in "${TARGET_DIR}"/model*.safetensors; do
                actual_size=$(stat -c%s "${f}" 2>/dev/null || stat -f%z "${f}" 2>/dev/null)
                [[ ${actual_size} -lt 1000000 ]] && { echo "ERROR: ${f} appears to be an LFS pointer, not actual weights"; exit 1; }
                break
              done
            fi

            [[ ! -f "${TARGET_DIR}/config.json" ]] && { echo "ERROR: Model clone incomplete - missing config.json"; exit 1; }
          fi

          echo "MODEL_PATH=${TARGET_DIR}" >> $OUTPUTS
          echo "Model ready at ${TARGET_DIR}"
        ssh:
          remoteHost: ${{ inputs.cluster.ip }}

  prepare-dataset:
    needs: [prepare_job_directory]
    steps:
      - name: Prepare dataset
        early-cancel: any-job-failed
        run: |
          OUTPUT_DIR="${{ needs.prepare_job_directory.outputs.OUTPUT_DIR }}"
          DATASET_DIR="${OUTPUT_DIR}/dataset"
          DATASET_CACHE_DIR="${{ inputs.dataset_config.dataset_cache_dir }}"
          DATASET_CACHE_DIR="${DATASET_CACHE_DIR/#\~/$HOME}"
          mkdir -p "${DATASET_DIR}" "${DATASET_CACHE_DIR}"

          DATASET_SOURCE="${{ inputs.dataset_config.dataset_source }}"
          echo "Dataset source: ${DATASET_SOURCE}"

          if [ "${DATASET_SOURCE}" == "local" ]; then
            LOCAL_PATH="${{ inputs.dataset_config.local_dataset_path }}"

            if [ ! -e "${LOCAL_PATH}" ]; then
              echo "Error: Local dataset path not found: ${LOCAL_PATH}"
              exit 1
            fi

            if [ -f "${LOCAL_PATH}" ]; then
              cp "${LOCAL_PATH}" "${DATASET_DIR}/"
            elif [ -d "${LOCAL_PATH}" ]; then
              cp -r "${LOCAL_PATH}"/* "${DATASET_DIR}/"
            fi
            echo "Dataset copied to ${DATASET_DIR}"
            ls -la "${DATASET_DIR}"

          else
            DATASET_NAME="${{ inputs.dataset_config.dataset_name }}"
            echo "Using HuggingFace Hub dataset: ${DATASET_NAME}"
            echo "Cache directory: ${DATASET_CACHE_DIR}"
            export HF_DATASETS_CACHE="${DATASET_CACHE_DIR}"
            CACHE_MARKER="${DATASET_CACHE_DIR}/.cached_datasets"
            if grep -q "^${DATASET_NAME}$" "${CACHE_MARKER}" 2>/dev/null; then
              echo "Dataset '${DATASET_NAME}' found in cache!"
            else
              echo "Dataset will be downloaded on first use and cached for future runs."
            fi
          fi
        ssh:
          remoteHost: ${{ inputs.cluster.ip }}

  prepare_containers:
    needs: [prepare_job_directory]
    steps:
      - name: Prepare Singularity container
        early-cancel: any-job-failed
        run: |
          set -euo pipefail

          FINETUNE_PATH="${{ inputs.container.finetune_path }}"
          FINETUNE_PATH="${FINETUNE_PATH/#\~/$HOME}"

          if [ -e "${FINETUNE_PATH}" ]; then
            echo "::notice::Container already present at ${FINETUNE_PATH} — skipping download"
            echo "SIF_PATH=${FINETUNE_PATH}" >> $OUTPUTS
            exit 0
          fi

          echo "::notice::Container not found at ${FINETUNE_PATH} — downloading via oras..."
          mkdir -p "$(dirname "${FINETUNE_PATH}")"

          ORAS_VERSION=1.2.2
          cd /tmp
          curl -LO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -zxf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" oras
          chmod +x /tmp/oras

          PARENT_DIR="$(dirname "${FINETUNE_PATH}")"
          EXPECTED_NAME="$(basename "${FINETUNE_PATH}")"

          echo "Pulling ghcr.io/parallelworks/finetune:v1.0 to ${PARENT_DIR}..."
          /tmp/oras pull ghcr.io/parallelworks/finetune:v1.0 -o "${PARENT_DIR}"

          # Rename pulled artifact if it does not match the expected filename
          if [ ! -e "${FINETUNE_PATH}" ]; then
            PULLED=$(ls "${PARENT_DIR}" 2>/dev/null | head -1)
            if [ -n "${PULLED}" ] && [ "${PULLED}" != "${EXPECTED_NAME}" ]; then
              echo "Renaming ${PARENT_DIR}/${PULLED} to ${FINETUNE_PATH}"
              mv "${PARENT_DIR}/${PULLED}" "${FINETUNE_PATH}"
            fi
          fi

          if [ ! -e "${FINETUNE_PATH}" ]; then
            echo "::error title=Container Download Failed::Container not found at ${FINETUNE_PATH} after oras pull. Check ghcr.io network access and the registry reference."
            exit 1
          fi

          echo "::notice::Container ready at ${FINETUNE_PATH}"
          echo "SIF_PATH=${FINETUNE_PATH}" >> $OUTPUTS
        ssh:
          remoteHost: ${{ inputs.cluster.ip }}

  finetune:
    needs: [prepare_containers, prepare-dataset, prepare_job_directory, prepare-model]
    working-directory: ${{ needs.prepare_job_directory.outputs.RUNDIR }}
    ssh:
      remoteHost: ${{ inputs.cluster.ip }}
    steps:
      - name: Create fine-tuning script
        early-cancel: any-job-failed
        run: |
          SCRIPT_PATH="${{ needs.prepare_job_directory.outputs.RUNDIR }}/start_finetune.sh"
          cat > "${SCRIPT_PATH}" << 'EOF'
          #!/bin/bash
          set -euo pipefail

          WORKDIR="${{ needs.prepare_job_directory.outputs.RUNDIR }}"
          OUTPUT_DIR="${{ needs.prepare_job_directory.outputs.OUTPUT_DIR }}"

          export SIF_PATH="${{ needs.prepare_containers.outputs.SIF_PATH }}"
          if [ ! -e "${SIF_PATH}" ]; then
            echo "::error title=Container Not Found::Singularity container not found at ${SIF_PATH}"
            exit 1
          fi
          echo "Using Singularity image: ${SIF_PATH}"

          export OUTPUT_DIR="${OUTPUT_DIR}"

          # Model source
          if [ "${{ inputs.model_selection.model_source }}" == "local" ]; then
            export MODEL_ID="${{ inputs.model_selection.local_model_path }}"
            echo "Using local model weights: ${MODEL_ID}"
          else
            CLONED_MODEL="${{ needs.prepare-model.outputs.MODEL_PATH }}"
            if [ -n "${CLONED_MODEL}" ] && [ -d "${CLONED_MODEL}" ]; then
              export MODEL_ID="${CLONED_MODEL}"
              echo "Using cached HuggingFace model: ${MODEL_ID}"
            else
              export MODEL_ID="${{ inputs.model_selection.base_model_id }}"
              echo "Using HuggingFace model ID: ${MODEL_ID}"
            fi
          fi

          # Dataset configuration
          export DATASET_SOURCE="${{ inputs.dataset_config.dataset_source }}"
          export DATASET_NAME="${{ inputs.dataset_config.dataset_name }}"
          export DATASET_SPLIT="${{ inputs.dataset_config.dataset_split }}"
          export DATASET_CONFIG_NAME="${{ inputs.dataset_config.dataset_config_name }}"
          export PROMPT_FIELD="${{ inputs.dataset_config.prompt_field }}"
          export LOCAL_DATASET_PATH="${{ inputs.dataset_config.local_dataset_path }}"
          export DATASET_FORMAT="${{ inputs.dataset_config.dataset_format }}"
          export MAX_SAMPLES="${{ inputs.dataset_config.max_samples }}"
          DATASET_CACHE_DIR="${{ inputs.dataset_config.dataset_cache_dir }}"
          DATASET_CACHE_DIR="${DATASET_CACHE_DIR/#\~/$HOME}"
          export DATASET_CACHE_DIR
          export HF_DATASETS_CACHE="${DATASET_CACHE_DIR}"

          # Training hyperparameters
          export NUM_EPOCHS="${{ inputs.training_hyperparameters.num_epochs }}"
          export LEARNING_RATE="${{ inputs.training_hyperparameters.learning_rate }}"
          export MICRO_BATCH_SIZE="${{ inputs.training_hyperparameters.micro_batch_size }}"
          export GRADIENT_ACCUMULATION="${{ inputs.training_hyperparameters.gradient_accumulation }}"
          export MAX_SEQ_LENGTH="${{ inputs.training_hyperparameters.max_seq_length }}"

          # LoRA configuration
          export LORA_R="${{ inputs.lora_config.lora_r }}"
          export LORA_ALPHA="${{ inputs.lora_config.lora_alpha }}"
          export LORA_DROPOUT="${{ inputs.lora_config.lora_dropout }}"
          export QUANTIZATION="${{ inputs.lora_config.quantization }}"
          export BF16="${{ inputs.lora_config.bf16 }}"
          export GRADIENT_CHECKPOINTING="${{ inputs.lora_config.gradient_checkpointing }}"
          export PACKING="${{ inputs.lora_config.packing }}"

          # Output configuration
          export MERGE_FULL_WEIGHTS="${{ inputs.output_config.merge_full_weights }}"
          export MERGED_SAVE_FORMAT="${{ inputs.output_config.merged_save_format }}"

          # GPU selection
          CUDA_VISIBLE_DEVICES_INPUT="${{ inputs.advanced_settings.cuda_visible_devices }}"
          if [ -n "${CUDA_VISIBLE_DEVICES_INPUT}" ]; then
            export CUDA_VISIBLE_DEVICES="${CUDA_VISIBLE_DEVICES_INPUT}"
          fi

          # TensorBoard — use the port the session runner already allocated
          if [ "${{ inputs.training_hyperparameters.tensorboard_enabled }}" == "true" ]; then
            export TENSORBOARD=true
            export TENSORBOARD_PORT="${service_port}"
          fi

          echo "======================================"
          echo "Training Configuration"
          echo "======================================"
          echo "Model:          ${MODEL_ID}"
          echo "Dataset Source: ${DATASET_SOURCE}"
          echo "Dataset:        ${DATASET_NAME:-${LOCAL_DATASET_PATH}}"
          echo "Epochs:         ${NUM_EPOCHS}"
          echo "Max Samples:    ${MAX_SAMPLES}"
          echo "Output Dir:     ${OUTPUT_DIR}"
          echo "Merge Weights:  ${MERGE_FULL_WEIGHTS}"
          echo "======================================"

          # Disable errexit so the session runner's cleanup trap (kill -- -$$)
          # does not propagate as failure when the process group is already gone.
          # Training exit code is still captured and returned explicitly.
          set +e
          cd "${WORKDIR}"
          ./scripts/run.sh
          exit $?
          EOF
          chmod +x "${SCRIPT_PATH}"

      - uses: github/parallelworks/interactive_session@main
        early-cancel: any-job-failed
        with:
          $yaml: workflow/session_runner/v1.4/general.yaml
          session: ${{ sessions.session }}
          resource: ${{ inputs.cluster }}
          cluster:
            scheduler: ${{ inputs.submit_to_scheduler }}
            slurm:
              is_enabled: ${{ inputs.slurm.is_enabled }}
              partition: ${{ inputs.slurm.partition }}
              scheduler_directives: ${{ inputs.slurm.scheduler_directives }}
              time: ${{ inputs.slurm.time }}
            pbs:
              is_enabled: ${{ inputs.pbs.is_enabled }}
              scheduler_directives: ${{ inputs.pbs.scheduler_directives }}
          service:
            start_service_script: ${{ needs.prepare_job_directory.outputs.RUNDIR }}/start_finetune.sh
            controller_script: ${{ needs.prepare_job_directory.outputs.RUNDIR }}/controller.sh
            inputs_sh: ${{ needs.prepare_job_directory.outputs.RUNDIR }}/inputs.sh
            slug: ''
            rundir: ${{ needs.prepare_job_directory.outputs.RUNDIR }}

  print_summary:
    needs: [finetune, prepare_job_directory]
    steps:
      - name: Display training summary
        run: |
          OUTPUT_DIR="${{ needs.prepare_job_directory.outputs.OUTPUT_DIR }}"
          echo "======================================"
          echo "Medical LLM Fine-tuning Summary"
          echo "======================================"
          echo "Model:            ${{ inputs.model_selection.base_model_id }}"
          echo "Dataset:          ${{ inputs.dataset_config.dataset_name }}"
          echo "Output Directory: ${OUTPUT_DIR}"
          echo ""
          if [ -d "${OUTPUT_DIR}/adapters" ]; then
            echo "Adapter files:"
            ls -la "${OUTPUT_DIR}/adapters"
          fi
          if [ -d "${OUTPUT_DIR}/merged" ]; then
            echo "Merged weight files:"
            ls -la "${OUTPUT_DIR}/merged"
          fi
          if [ -f "${OUTPUT_DIR}/logs/finetune.log" ]; then
            echo ""
            echo "Last 20 lines of training log:"
            tail -20 "${OUTPUT_DIR}/logs/finetune.log"
          fi
          echo ""
          echo "======================================"
          echo "To serve this model with activate-rag-vllm/workflow.yaml, set:"
          echo "  Model Source → Local Path (pre-staged weights)"
          echo "  Model Path   → ${OUTPUT_DIR}"
          echo "======================================"
        ssh:
          remoteHost: ${{ inputs.cluster.ip }}
